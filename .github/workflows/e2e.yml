name: E2E

# The demo image is built once and started twice:
# 1. against the REAL Supertext API (secret SUPERTEXT_API_KEY): language list check and the
#    end-to-end test (test/e2e), so language mapping and the live API's behaviour are tested;
# 2. against the stand-in API (test/mock-sample-de.mjs): the docs screenshots, so the images
#    don't change with every machine translation. Changed images become a pull request.
# See "End-to-end tests" and "Docs screenshots" in docs/DEVELOPER.md.

on:
  workflow_dispatch:
  # A pull request that changes the E2E test itself runs it before merging.
  pull_request:
    paths:
      - 'test/e2e/**'
      - '.github/workflows/e2e.yml'
  schedule:
    - cron: '54 5 * * 1' # Mondays, 05:54 UTC
  push:
    branches: [main]
    paths:
      - 'admin/**'
      - 'server/**'
      - 'package.json'
      - 'package-lock.json'
      - 'demo/**'
      - 'Dockerfile'
      - 'test/**'
      - '.github/workflows/e2e.yml'

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  e2e:
    name: E2E (live API) and screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      images-changed: ${{ steps.images.outputs.changed }}
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      LIVE_URL: http://127.0.0.1:8081
      DOCS_URL: http://127.0.0.1:8082
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the demo image (cached between runs)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          tags: strapi-supertext-demo
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Demo accounts and secrets for this run only
        run: |
          # Strapi's password rule: upper- and lower-case letter and a number.
          for v in DEMO_ADMIN_PASSWORD DEMO_EDITOR_PASSWORD; do
            value="Pw$(openssl rand -hex 12)9"
            echo "::add-mask::$value"
            echo "$v=$value" >> "$GITHUB_ENV"
          done
          for v in ADMIN_JWT_SECRET API_TOKEN_SALT TRANSFER_TOKEN_SALT JWT_SECRET ENCRYPTION_KEY; do
            value="$(openssl rand -hex 16)"
            echo "::add-mask::$value"
            echo "$v=$value" >> "$GITHUB_ENV"
          done
          keys="$(openssl rand -hex 16),$(openssl rand -hex 16)"
          echo "::add-mask::$keys"
          echo "APP_KEYS=$keys" >> "$GITHUB_ENV"
          {
            echo "DEMO_ADMIN_EMAIL=admin@e2e.example.com"
            echo "DEMO_EDITOR_EMAIL=editor@e2e.example.com"
          } >> "$GITHUB_ENV"

      - name: Install the test tools
        run: |
          npm ci --no-audit --no-fund
          (cd test/e2e && npm ci --no-audit --no-fund)
          npx playwright install --with-deps chromium
          (cd test/e2e && npx playwright install chromium)

      # --- 1. Real Supertext API ----------------------------------------------------------
      - name: Check for the API key
        id: key
        env:
          SUPERTEXT_API_KEY: ${{ secrets.SUPERTEXT_API_KEY }}
        run: |
          if [ -n "$SUPERTEXT_API_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Secret SUPERTEXT_API_KEY is not set: skipping the tests against the real Supertext API (see docs/DEVELOPER.md → End-to-end tests)."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Start the demo against the real API
        if: steps.key.outputs.present == 'true'
        env:
          SUPERTEXT_API_KEY: ${{ secrets.SUPERTEXT_API_KEY }}
        run: |
          psql -h 127.0.0.1 -U postgres -c 'CREATE DATABASE strapi_live'
          # Version reports off: CI runs are no installations for the Commando Center.
          docker run -d --name demo-live --network host \
            -e PORT=8081 -e APP_KEYS -e ADMIN_JWT_SECRET -e API_TOKEN_SALT -e TRANSFER_TOKEN_SALT -e JWT_SECRET -e ENCRYPTION_KEY \
            -e DATABASE_URL=postgres://postgres:postgres@127.0.0.1:5432/strapi_live \
            -e SUPERTEXT_API_KEY -e SUPERTEXT_VERSION_REPORTS=0 -e STRAPI_TELEMETRY_DISABLED=true \
            -e DEMO_ADMIN_EMAIL -e DEMO_ADMIN_PASSWORD -e DEMO_EDITOR_EMAIL -e DEMO_EDITOR_PASSWORD \
            strapi-supertext-demo
          timeout 300 sh -c "until curl -sf -o /dev/null $LIVE_URL/_health; do sleep 3; done" || { docker logs demo-live; exit 1; }

      - name: Language list against the real API
        if: steps.key.outputs.present == 'true'
        env:
          SUPERTEXT_API_KEY: ${{ secrets.SUPERTEXT_API_KEY }}
          E2E_SOURCE: en
          E2E_TARGETS: de-CH,fr-CH,it-CH
        run: |
          node test/e2e/features.mjs

      - name: End-to-end test against the real API
        if: steps.key.outputs.present == 'true'
        working-directory: test/e2e
        env:
          STRAPI_URL: ${{ env.LIVE_URL }}
          EDITOR_EMAIL: ${{ env.DEMO_EDITOR_EMAIL }}
          EDITOR_PASSWORD: ${{ env.DEMO_EDITOR_PASSWORD }}
        run: node live.mjs

      # --- 2. Docs screenshots against the stand-in ----------------------------------------
      - name: Screenshots against the stand-in API
        if: success() || failure()
        run: |
          (nohup node test/mock-sample-de.mjs > test/stand-in.log 2>&1 &)
          psql -h 127.0.0.1 -U postgres -c 'CREATE DATABASE strapi_docs'
          docker run -d --name demo-docs --network host \
            -e PORT=8082 -e APP_KEYS -e ADMIN_JWT_SECRET -e API_TOKEN_SALT -e TRANSFER_TOKEN_SALT -e JWT_SECRET -e ENCRYPTION_KEY \
            -e DATABASE_URL=postgres://postgres:postgres@127.0.0.1:5432/strapi_docs \
            -e SUPERTEXT_API_KEY=test-key -e SUPERTEXT_API_ENDPOINT=http://127.0.0.1:8765/v1/ \
            -e SUPERTEXT_REPORT_URL=http://127.0.0.1:8765/report -e STRAPI_TELEMETRY_DISABLED=true \
            -e DEMO_ADMIN_EMAIL -e DEMO_ADMIN_PASSWORD -e DEMO_EDITOR_EMAIL -e DEMO_EDITOR_PASSWORD \
            strapi-supertext-demo
          timeout 300 sh -c "until curl -sf -o /dev/null $DOCS_URL/_health; do sleep 3; done" || { docker logs demo-docs; exit 1; }
          STRAPI_URL="$DOCS_URL" node test/docs-screenshots.mjs

      - name: Did the screenshots change?
        id: images
        if: success() || failure()
        run: |
          if [ -n "$(git status --porcelain docs/images)" ]; then
            git status --short docs/images
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload the screenshots
        if: steps.images.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-images
          path: docs/images/

      - name: Collect logs for debugging
        if: failure()
        run: |
          mkdir -p e2e-debug
          cp -r test/e2e/artifacts e2e-debug/ 2>/dev/null || true
          cp test/stand-in.log e2e-debug/ 2>/dev/null || true
          for c in demo-live demo-docs; do docker logs "$c" > "e2e-debug/$c.log" 2>&1 || true; done

      - name: Upload logs for debugging
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-debug
          path: e2e-debug/
          retention-days: 7

  screenshots-pr:
    name: Pull request with new screenshots
    needs: e2e
    if: needs.e2e.outputs.images-changed == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docs-images
          path: docs/images/

      - name: Push a branch and open (or update) the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          branch=automation/docs-screenshots
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "$branch"
          git add docs/images
          git commit -m "Docs: regenerate screenshots" -m "Made by the E2E workflow: $RUN_URL"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "$branch"
          if [ -z "$(gh pr list --repo "$REPO" --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create --repo "$REPO" --head "$branch" --base main \
              --title "Docs: regenerate screenshots" \
              --body "The E2E workflow took new screenshots of the demo (against the stand-in API) and they differ from \`docs/images/\`. Check that the changes are intended before merging. Run: $RUN_URL"
          fi
