version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # Major versions we can't take yet (see docs/DEVELOPER.md):
    ignore:
      - dependency-name: "typescript"  # TypeScript 7 is the native compiler; vue-tsc and the build tooling still need 5.x
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"  # types must match the oldest supported Node version, not the newest
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"  # Strapi 5's admin ships React 18
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"  # Strapi 5's admin ships React 18
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-router-dom"  # Strapi 5's admin uses react-router-dom 6
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-intl"  # Strapi 5's admin provides react-intl 6
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
